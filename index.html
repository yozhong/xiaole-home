<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小勒的官網𝕏𝕚𝕒𝕠𝕃𝕖'𝕤 𝕠𝕗𝕗𝕚𝕔𝕚𝕒𝕝 𝕨𝕖𝕓𝕤𝕚𝕥𝕖</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #a1c4fd, #c2e9fb); 
            color: #4a5568;
            text-align: center;
            padding: 40px 15px;
            margin: 0;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }
        .container {
            width: 100%;
            max-width: 450px;
            margin: auto;
            background: rgba(255, 255, 255, 0.88);
            padding: 30px 20px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(161, 196, 253, 0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* 完美復刻圖二：點我有驚喜對話框 */
        .tooltip-bubble {
            background: linear-gradient(to bottom, #ffffff, #ffe3e3);
            color: #4a5568;
            font-size: 14px;
            font-weight: bold;
            padding: 8px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            position: relative;
            margin-bottom: 12px;
            display: inline-block;
            border: 1px solid rgba(255, 182, 193, 0.4);
            animation: bubbleFloat 2s ease-in-out infinite;
        }
        /* 對話框下方的小三角形尖角 */
        .tooltip-bubble::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px 6px 0;
            border-style: solid;
            border-color: #ffe3e3 transparent;
            display: block;
            width: 0;
        }
        @keyframes bubbleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        
        img.avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            object-fit: cover;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: floatLoFi 4s ease-in-out infinite;
        }
        @keyframes floatLoFi {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        img.avatar.playing {
            animation: floatLoFi 4s ease-in-out infinite, lofiPulse 2s infinite ease-in-out;
            border-color: #a29bfe;
        }
        @keyframes lofiPulse {
            0%, 100% { box-shadow: 0 6px 15px rgba(162, 155, 254, 0.4); }
            50% { box-shadow: 0 8px 30px rgba(108, 92, 231, 0.8); }
        }

        h1 { 
            margin: 15px 0 10px; 
            font-size: 20px; 
            color: #4a69bd;
            word-break: break-all;
        }
        p.tagline { 
            font-style: italic; 
            color: #718096; 
            margin-bottom: 30px;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
        }
        .links-container { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            width: 100%;
        }
        .link-btn {
            display: block;
            padding: 15px;
            background: #74b9ff;
            color: white;
            text-decoration: none;
            border-radius: 14px;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 4px 15px rgba(116, 185, 255, 0.2);
            transition: all 0.2s ease;
            cursor: pointer;
            width: 100%;
        }
        .link-btn:active { 
            transform: scale(0.98);
            background: #4a69bd;
        }

        footer { 
            margin-top: 40px; 
            font-size: 11px; 
            color: #a0aec0; 
        }
        
        /* 特效元件 */
        .snowflake {
            position: fixed;
            top: -10%;
            z-index: 1;
            background-size: cover;
            border-radius: 50%;
            pointer-events: none;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { top: -10%; transform: translateX(0) rotate(0deg); }
            100% { top: 110%; transform: translateX(30px) rotate(180deg); } 
        }

        .trail-paws {
            position: fixed;
            pointer-events: none;
            z-index: 5;
            width: 25px;
            height: 25px;
            background-size: cover;
            border-radius: 50%;
            opacity: 0.8;
            transform: translate(-50%, -50%);
            animation: fadeOutPaws 0.5s ease-out forwards;
        }
        @keyframes fadeOutPaws {
            0% { opacity: 0.8; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
        }

        .click-burst {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            width: 45px;
            height: 45px;
            background-size: cover;
            border-radius: 50%;
            animation: burstOut 0.6s ease-out forwards;
        }
        @keyframes burstOut {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(var(--mx), var(--my)) scale(1.1); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 復刻圖二樣式的對話泡泡提示框 -->
        <div class="tooltip-bubble">點我有驚喜！</div>
        
        <!-- 大頭貼圖片 -->
        <img class="avatar" id="mainAvatar" src="avatar.png" alt="小勒的頭像">
        
        <h1>小勒的秘密基地ฅ^•ω•^ฅ</h1>
        <p class="tagline">竟然被你發現了?!(害羞害羞)^//• ω •//^</p>
        
        <div class="links-container">
            <a class="link-btn" href="https://www.youtube.com/@%E6%83%B3%E8%A6%81700%E8%A8%82%E9%96%B1%E7%9A%84%E5%B0%8F%E5%8B%92" target="_blank">🎬 YouTube 頻道 🎬</a>
            <a class="link-btn" href="https://telegra.ph/%E8%87%AA%E8%A8%AD%E4%BB%8B%E7%B4%B9-%E0%B8%85%CF%89%E0%B8%85-10-25" target="_blank">📜 自設介紹 📜</a>
        </div>
        
        <footer>© 2026 想要700訂閱的小勒 Project</footer>
    </div>

    <script>
        // 抓取網頁上成功載入的頭像網址，確保特效百分之百有貓貓圖
        function getAvatarUrl() {
            return "url('avatar.png')";
        }

        // 1. 背景圖片自動飄落
        function createFallingCat() {
            const cat = document.createElement('div');
            cat.classList.add('snowflake');
            cat.style.backgroundImage = getAvatarUrl(); 
            cat.style.left = Math.random() * 100 + 'vw';
            cat.style.animationDuration = Math.random() * 4 + 7 + 's'; 
            cat.style.opacity = Math.random() * 0.2 + 0.4; 
            const size = Math.random() * 25 + 40; 
            cat.style.width = size + 'px';
            cat.style.height = size + 'px';
            document.body.appendChild(cat);
            setTimeout(() => { cat.remove(); }, 11000);
        }
        setInterval(createFallingCat, 900); 

        // 2. 軌跡特效建立函數
        function spawnTrail(x, y) {
            const paw = document.createElement('div');
            paw.classList.add('trail-paws');
            paw.style.backgroundImage = getAvatarUrl(); 
            paw.style.left = x + 'px';
            paw.style.top = y + 'px';
            document.body.appendChild(paw);
            setTimeout(() => { paw.remove(); }, 500);
        }

        // 電腦滑鼠移動軌跡
        let lastMove = 0;
        window.addEventListener('mousemove', (e) => {
            const now = Date.now();
            if (now - lastMove < 50) return; 
            lastMove = now;
            spawnTrail(e.clientX, e.clientY);
        });

        // 修正：手機手指拖曳軌跡語法
        window.addEventListener('touchmove', (e) => {
            const now = Date.now();
            if (now - lastMove < 50) return;
            lastMove = now;
            if(e.touches && e.touches.length > 0) {
                spawnTrail(e.touches[0].clientX, e.touches[0].clientY);
            }
        });

        // 3. 點擊大爆發函數
        function triggerBurst(x, y) {
            for (let i = 0; i < 10; i++) { 
                const burst = document.createElement('div');
                burst.classList.add('click-burst');
                burst.style.backgroundImage = getAvatarUrl(); 
                burst.style.left = x + 'px';
                burst.style.top = y + 'px';
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 100 + 50;
                const mx = Math.cos(angle) * distance + 'px';
                const my = Math.sin(angle) * distance + 'px';
                burst.style.setProperty('--mx', mx);
                burst.style.setProperty('--my', my);
                document.body.appendChild(burst);
                setTimeout(() => { burst.remove(); }, 600);
            }
        }

        function handleClickOrTouch(e, clientX, clientY) {
            if (e.target.tagName !== 'A' && e.target.id !== 'mainAvatar') {
                triggerBurst(clientX, clientY);
            }
        }

        window.addEventListener('click', (e) => {
            if (e.detail === 0) return; 
            handleClickOrTouch(e, e.clientX, e.clientY);
        });
        // --- 簡單的真實 MP3 播放控制 ---
        let audio = new Audio('bgm.mp3'); // 讀取你上傳的音訊檔
        audio.loop = true; // 設定自動循環播放
        let isPlaying = false;

        const avatarBtn = document.getElementById('mainAvatar');
        avatarBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!isPlaying) {
            audio.play();
            isPlaying = true;
            avatarBtn.classList.add('playing'); // 讓頭像開始發光/律動
        } else {
            audio.pause();
            isPlaying = false;
            avatarBtn.classList.remove('playing');
        }
    });
