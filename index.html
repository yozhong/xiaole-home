<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小勒的官網𝕏𝕚𝕒𝕠𝕃𝕖'𝕤 𝕠𝕗𝕗𝕚𝕔𝕚𝕒𝕝 𝕨𝕖𝕓𝕤𝕚𝕥𝕖</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #a1c4fd, #c2e9fb); 
            color: #4a5568;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: rgba(255, 255, 255, 0.88);
            padding: 35px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(161, 196, 253, 0.3);
            backdrop-filter: blur(8px);
            position: relative;
            z-index: 10;
        }
        img.avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            object-fit: cover;
            animation: floatLoFi 4s ease-in-out infinite;
        }
        @keyframes floatLoFi {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        h1 { 
            margin: 20px 0 10px; 
            font-size: 22px; 
            color: #4a69bd;
        }
        p.tagline { 
            font-style: italic; 
            color: #718096; 
            margin-bottom: 35px;
            font-size: 15px;
            font-weight: 500;
        }
        .links-container { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }
        .link-btn {
            display: block;
            padding: 16px;
            background: #74b9ff;
            color: white;
            text-decoration: none;
            border-radius: 14px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(116, 185, 255, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .link-btn:hover { 
            background: #4a69bd; 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 105, 189, 0.3);
        }
        
        /* Lo-Fi 音樂專用按鈕 */
        .lofi-btn {
            background: #a29bfe;
            box-shadow: 0 4px 15px rgba(162, 155, 254, 0.2);
            margin-top: 10px;
        }
        .lofi-btn:hover {
            background: #6c5ce7;
            box-shadow: 0 6px 20px rgba(108, 92, 231, 0.3);
        }
        
        .playing {
            animation: lofiPulse 2s infinite ease-in-out;
            background: #6c5ce7;
        }
        @keyframes lofiPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.02); }
        }

        footer { 
            margin-top: 50px; 
            font-size: 12px; 
            color: #a0aec0; 
        }
        
        /* 背景飄落貓咪圖片 */
        .snowflake {
            position: fixed;
            top: -10%;
            z-index: 1;
            background-image: url('avatar.png');
            background-size: cover;
            border-radius: 50%;
            pointer-events: none;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { top: -10%; transform: translateX(0) rotate(0deg); }
            100% { top: 110%; transform: translateX(50px) rotate(180deg); } 
        }

        /* 滑鼠拖曳軌跡樣式 */
        .trail-paws {
            position: fixed;
            pointer-events: none;
            z-index: 5;
            width: 25px;
            height: 25px;
            background-image: url('avatar.png');
            background-size: cover;
            border-radius: 50%;
            opacity: 0.8;
            transform: translate(-50%, -50%);
            animation: fadeOutPaws 0.5s ease-out forwards;
        }
        @keyframes fadeOutPaws {
            0% { opacity: 0.8; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
        }

        /* 滑鼠點擊大爆炸圖片樣式 */
        .click-burst {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            width: 45px;
            height: 45px;
            background-image: url('avatar.png');
            background-size: cover;
            border-radius: 50%;
            animation: burstOut 0.6s ease-out forwards;
        }
        @keyframes burstOut {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(var(--mx), var(--my)) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 讀取同資料夾的 avatar.png -->
        <img class="avatar" src="avatar.png" alt="小勒的頭像">
        
        <h1>小勒的秘密基地ฅ^•ω•^ฅ</h1>
        <p class="tagline">竟然被你發現了?!(害羞害羞)^//• ω •//^</p>
        
        <div class="links-container">
            <a class="link-btn" href="https://youtube.com" target="_blank">YouTube 頻道 🎬</a>
            <!-- 新增的自設介紹按鈕 -->
            <a class="link-btn" href="https://telegra.ph" target="_blank">自設介紹 📜</a>
            <div class="link-btn lofi-btn" id="musicBtn">🎵 播放音樂 🎵</div>
        </div>
        
        <footer>© 2026 想要700訂閱的小勒 Project</footer>
    </div>

    <script>
        // 1. 圖片自動飄落功能
        function createFallingCat() {
            const cat = document.createElement('div');
            cat.classList.add('snowflake');
            cat.style.left = Math.random() * 100 + 'vw';
            cat.style.animationDuration = Math.random() * 4 + 7 + 's'; 
            cat.style.opacity = Math.random() * 0.2 + 0.35; 
            const size = Math.random() * 25 + 40; 
            cat.style.width = size + 'px';
            cat.style.height = size + 'px';
            document.body.appendChild(cat);
            setTimeout(() => { cat.remove(); }, 11000);
        }
        setInterval(createFallingCat, 900); 

        // 2. 滑鼠移動留下圖片軌跡特效
        let lastMove = 0;
        window.addEventListener('mousemove', (e) => {
            const now = Date.now();
            if (now - lastMove < 50) return; 
            lastMove = now;
            const paw = document.createElement('div');
            paw.classList.add('trail-paws');
            paw.style.left = e.clientX + 'px';
            paw.style.top = e.clientY + 'px';
            document.body.appendChild(paw);
            setTimeout(() => { paw.remove(); }, 500);
        });

        // 3. 滑鼠點擊空白處或文字時大爆發（排除按鈕點擊）
        function triggerBurst(x, y) {
            for (let i = 0; i < 10; i++) {
                const burst = document.createElement('div');
                burst.classList.add('click-burst');
                burst.style.left = x + 'px';
                burst.style.top = y + 'px';
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 100 + 50;
                const mx = Math.cos(angle) * distance + 'px';
                const my = Math.sin(angle) * distance + 'px';
                burst.style.setProperty('--mx', mx);
                burst.style.setProperty('--my', my);
                document.body.appendChild(burst);
                setTimeout(() => { burst.remove(); }, 600);
            }
        }

        window.addEventListener('click', (e) => {
            // 如果點到的東西不是超連結 (A) 且不是音樂按鈕，才觸發滑鼠爆炸
            if (e.target.tagName !== 'A' && e.target.id !== 'musicBtn') {
                triggerBurst(e.clientX, e.clientY);
            }
        });

        // 4. 自製放鬆 Lo-Fi 音樂樂理合成器
        let audioCtx = null;
        let isPlaying = false;
        let lofiInterval = null;
        let step = 0;

        const chords = [
            [261.63, 329.63, 392.00, 493.88], 
            [220.00, 261.63, 329.63, 392.00], 
            [293.66, 349.23, 440.00, 523.25], 
            [196.00, 246.94, 293.66, 392.00]  
        ];

        function playLoFiBeat() {
            if (!audioCtx || !isPlaying) return;

            const now = audioCtx.currentTime;
            const currentChord = chords[Math.floor(step / 4) % chords.length];

            if (step % 2 === 0) {
                let noiseOsc = audioCtx.createOscillator();
                let noiseGain = audioCtx.createGain();
                noiseOsc.type = 'triangle';
                noiseOsc.frequency.setValueAtTime(60 + Math.random() * 5, now);
                noiseGain.gain.setValueAtTime(0.015, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                noiseOsc.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);
                noiseOsc.start(now);
                noiseOsc.stop(now + 0.3);
            }

            if (step % 2 === 0) {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(85, now); 
                osc.frequency.exponentialRampToValueAtTime(45, now + 0.12); 
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.18);
            }

            if (step % 4 === 0) {
                currentChord.forEach((freq, i) => {
                    if (Math.random() > 0.25) { 
                        let osc = audioCtx.createOscillator();
