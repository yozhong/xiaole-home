<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>想要700訂閱的小勒 | Portal Site</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffe6e6, #ffb3b3); /* 這裡可以更換背景顏色 */
            color: #333;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: rgba(255, 255, 255, 0.85);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        img.avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #fff;
        }
        h1 { margin: 20px 0 10px; font-size: 24px; }
        p.tagline { font-style: italic; color: #666; margin-bottom: 30px; }
        .links-container { display: flex; flex-direction: column; gap: 15px; }
        .link-btn {
            display: block;
            padding: 15px;
            background: #ff6666;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
        }
        .link-btn:hover { background: #ff4d4d; transform: scale(1.02); }
        footer { margin-top: 40px; font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 替換成小勒的頭像網址 -->
        <img class="avatar" src="https://placeholder.com" alt="小勒的頭像">

        <h1>想要700訂閱的小勒</h1>
        <p class="tagline">一同見證達成 700 訂閱的奇蹟時刻！</p>

        <div class="links-container">
            <a class="link-btn" href="https://www.youtube.com/@%E6%83%B3%E8%A6%81700%E8%A8%82%E9%96%B1%E7%9A%84%E5%B0%8F%E5%8B%92" target="_blank">YouTube 頻道</a>
            <!-- 在這裡可以自由增加其他社群或平台的連結 -->
        </div>

        <footer>© 2026 想要700訂閱的小勒 Project</footer>
    </div>
</body>
</html>
