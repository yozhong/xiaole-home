<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小勒的官網𝕏𝕚𝕒𝕠𝕃𝕖'𝕤 𝕠𝕗𝕗𝕚𝕔𝕚𝕒𝕝 𝕨𝕖𝕓𝕤𝕚𝕥𝕖</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* 調整為更柔和、適合專心寫作業的粉藍復古慵懶漸層 */
            background: linear-gradient(135deg, #a1c4fd, #c2e9fb); 
            color: #4a5568;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: rgba(255, 255, 255, 0.88);
            padding: 35px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(161, 196, 253, 0.3);
            backdrop-filter: blur(8px);
            position: relative;
            z-index: 10;
        }
        img.avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            object-fit: cover;
            /* 慢速、極其輕柔的漂浮感，營造放鬆氛圍 */
            animation: floatLoFi 4s ease-in-out infinite;
        }
        @keyframes floatLoFi {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        h1 { 
            margin: 20px 0 10px; 
            font-size: 22px; 
            color: #4a69bd;
        }
        p.tagline { 
            font-style: italic; 
            color: #718096; 
            margin-bottom: 35px;
            font-size: 15px;
            font-weight: 500;
        }
        .links-container { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }
        .link-btn {
            display: block;
            padding: 16px;
            background: #74b9ff;
            color: white;
            text-decoration: none;
            border-radius: 14px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(116, 185, 255, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .link-btn:hover { 
            background: #4a69bd; 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 105, 189, 0.3);
        }
        
        /* Lo-Fi 音樂專用按鈕 */
        .lofi-btn {
            background: #a29bfe;
            box-shadow: 0 4px 15px rgba(162, 155, 254, 0.2);
            margin-top: 10px;
        }
        .lofi-btn:hover {
            background: #6c5ce7;
            box-shadow: 0 6px 20px rgba(108, 92, 231, 0.3);
        }
        
        /* 音樂播放時按鈕的溫和呼吸特效 */
        .playing {
            animation: lofiPulse 2s infinite ease-in-out;
            background: #6c5ce7;
        }
        @keyframes lofiPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.02); }
        }

        footer { 
            margin-top: 50px; 
            font-size: 12px; 
            color: #a0aec0; 
        }
        
        /* 溫柔緩慢飄落的貓咪圖片背景 */
        .snowflake {
            position: fixed;
            top: -10%;
            z-index: 1;
            background-image: url('avatar.png');
            background-size: cover;
            border-radius: 50%;
            pointer-events: none;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { top: -10%; transform: translateX(0) rotate(0deg); }
            100% { top: 110%; transform: translateX(50px) rotate(180deg); } /* 旋轉幅度減半，更穩定不刺眼 */
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 讀取同資料夾的 avatar.png -->
        <img class="avatar" src="avatar.png" alt="小勒的頭像">
        
        <h1>小勒的秘密基地ฅ^•ω•^ฅ</h1>
        <p class="tagline">竟然被你發現了?!(害羞害羞)^//• ω •//^</p>
        
        <div class="links-container">
            <a class="link-btn" href="https://www.youtube.com/@%E6%83%B3%E8%A6%81700%E8%A8%82%E9%96%B1%E7%9A%84%E5%B0%8F%E5%8B%92" target="_blank">YouTube 頻道 🎬</a>
            <!-- 專注作業用的音樂按鈕，已移除任何驚喜爆炸特效 -->
            <div class="link-btn lofi-btn" id="musicBtn">🎵 播放音樂 🎵</div>
        </div>
        
        <footer>© 2026 想要700訂閱的小勒 Project</footer>
    </div>

    <script>
        // 1. 溫和緩慢的圖片自動飄落（調慢速度與減少數量，適合專心）
        function createFallingCat() {
            const cat = document.createElement('div');
            cat.classList.add('snowflake');
            cat.style.left = Math.random() * 100 + 'vw';
            // 速度拉長到 8~12 秒才飄完，非常平靜
            cat.style.animationDuration = Math.random() * 4 + 8 + 's'; 
            cat.style.opacity = Math.random() * 0.2 + 0.2; // 降低透明度不干擾視線
            const size = Math.random() * 15 + 20; 
            cat.style.width = size + 'px';
            cat.style.height = size + 'px';
            document.body.appendChild(cat);
            setTimeout(() => { cat.remove(); }, 12000);
        }
        setInterval(createFallingCat, 1200); // 拉長產生間隔

        // 2. 自製慵懶放鬆 Lo-Fi 音樂樂理合成器 (Web Audio API)
        let audioCtx = null;
        let isPlaying = false;
        let lofiInterval = null;
        let step = 0;

        // Lo-Fi 常用的暖色調爵士七和弦音高 (Cmaj7 - Am7 - Dm7 - G7 舒服循環)
        const chords = [
            [261.63, 329.63, 392.00, 493.88], // Cmaj7 (溫暖舒適)
            [220.00, 261.63, 329.63, 392.00], // Am7 (慵懶帶點微酸)
            [293.66, 349.23, 440.00, 523.25], // Dm7 (放鬆專注)
            [196.00, 246.94, 293.66, 392.00]  // G7 (平穩完美過渡)
        ];

        function playLoFiBeat() {
            if (!audioCtx || !isPlaying) return;

            const now = audioCtx.currentTime;
            const currentChord = chords[Math.floor(step / 4) % chords.length];

            // --- 類比低保真模擬：微弱的溫暖低頻底噪 (Vinyl Crackle Feel) ---
            if (step % 2 === 0) {
                let noiseOsc = audioCtx.createOscillator();
                let noiseGain = audioCtx.createGain();
                noiseOsc.type = 'triangle';
                noiseOsc.frequency.setValueAtTime(60 + Math.random() * 5, now); // 低頻嗡鳴
                noiseGain.gain.setValueAtTime(0.015, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                noiseOsc.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);
                noiseOsc.start(now);
                noiseOsc.stop(now + 0.4);
            }

            // --- 舒服的心跳重低音節拍 (Lo-Fi Hip-Hop Kick) ---
            if (step % 2 === 0) {
                let kickOsc = document.createElement('div'); // 節拍器
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(80, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.15); // 沉穩重低音
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            }

            // --- 慵懶飄渺的爵士和弦 (Chill Chords) ---
            if (step % 4 === 0) {
                // 每次隨機彈奏和弦裡的 2-3 個音，聽起來更隨性放鬆
                currentChord.forEach((freq, i) => {
                    if (Math.random() > 0.3) { 
                        let osc = audioCtx.createOscillator();
                        let gain = audioCtx.createGain();
                        
                        osc.type = 'sine'; // 正弦波，最純淨、溫柔且不刺耳的復古音色
                        // 微調音高 (Detuning) 營造出 Lo-Fi 特有的舊磁帶飄忽感
                        osc.frequency.setValueAtTime(freq + (Math.random() * 2 - 1), now); 
                        
                        gain.gain.setValueAtTime(0.0, now);
                        // 慢淡入 (Slow Attack) 讓聲音很溫柔地飄進來
                        gain.gain.linearRampToValueAtTime(0.06, now + 0.2); 
                        // 慢淡出 (Slow Release) 延音拉長，適合放鬆
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.8);
                        
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now);
                        osc.stop(now + 1.9);
                    }
                });
            }

            step++;
        }

        // 3. 按鈕事件綁定
        const musicBtn = document.getElementById('musicBtn');
        musicBtn.addEventListener('click', () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            if (!isPlaying) {
                isPlaying = true;
                musicBtn.innerText = "☕ 音樂播放中 ☕";
                musicBtn.classList.add('playing');
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                // 每 550 毫秒走一拍，非常舒適、不急促的慵懶慢節奏 (BPM 約 110)
                lofiInterval = setInterval(playLoFiBeat, 550);
                playLoFiBeat();
            } else {
                isPlaying = false;
                musicBtn.innerText = "🎵 播放音樂 🎵";
                musicBtn.classList.remove('playing');
                clearInterval(lofiInterval);
            }
        });
    </script>
</body>
</html>
