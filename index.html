<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小勒的官網𝕏𝕚𝕒𝕠𝕃𝕖'𝕤 𝕠𝕗𝕗𝕚𝕔𝕚𝕒𝕝 𝕨𝕖𝕓𝕤𝕚𝕥𝕖</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none; /* 避免手機長按文字被選取 */
            -webkit-tap-highlight-color: transparent; /* 移除手機點擊時的藍色陰影框 */
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #a1c4fd, #c2e9fb); 
            color: #4a5568;
            text-align: center;
            padding: 40px 15px;
            margin: 0;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }
        .container {
            width: 100%;
            max-width: 450px;
            margin: auto;
            background: rgba(255, 255, 255, 0.88);
            padding: 30px 20px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(161, 196, 253, 0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            position: relative;
            z-index: 10;
        }
        
        img.avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            object-fit: cover;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: floatLoFi 4s ease-in-out infinite;
        }
        @keyframes floatLoFi {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        img.avatar.playing {
            animation: floatLoFi 4s ease-in-out infinite, lofiPulse 2s infinite ease-in-out;
            border-color: #a29bfe;
        }
        @keyframes lofiPulse {
            0%, 100% { box-shadow: 0 6px 15px rgba(162, 155, 254, 0.4); }
            50% { box-shadow: 0 8px 30px rgba(108, 92, 231, 0.8); }
        }

        h1 { 
            margin: 15px 0 10px; 
            font-size: 20px; 
            color: #4a69bd;
            word-break: break-all;
        }
        p.tagline { 
            font-style: italic; 
            color: #718096; 
            margin-bottom: 30px;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
        }
        .links-container { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }
        .link-btn {
            display: block;
            padding: 15px;
            background: #74b9ff;
            color: white;
            text-decoration: none;
            border-radius: 14px;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 4px 15px rgba(116, 185, 255, 0.2);
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .link-btn:active { /* 手機點擊時的反饋效果 */
            transform: scale(0.98);
            background: #4a69bd;
        }

        footer { 
            margin-top: 40px; 
            font-size: 11px; 
            color: #a0aec0; 
        }
        
        /* 特效元件 */
        .snowflake {
            position: fixed;
            top: -10%;
            z-index: 1;
            background-size: cover;
            border-radius: 50%;
            pointer-events: none;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { top: -10%; transform: translateX(0) rotate(0deg); }
            100% { top: 110%; transform: translateX(30px) rotate(180deg); } 
        }

        .trail-paws {
            position: fixed;
            pointer-events: none;
            z-index: 5;
            width: 22px;
            height: 22px;
            background-size: cover;
            border-radius: 50%;
            opacity: 0.8;
            transform: translate(-50%, -50%);
            animation: fadeOutPaws 0.5s ease-out forwards;
        }
        @keyframes fadeOutPaws {
            0% { opacity: 0.8; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
        }

        .click-burst {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            width: 38px;
            height: 38px;
            background-size: cover;
            border-radius: 50%;
            animation: burstOut 0.6s ease-out forwards;
        }
        @keyframes burstOut {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(var(--mx), var(--my)) scale(1.1); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 手機長按會有「點我有驚喜」提示字，且點擊能播放音樂 -->
        <img class="avatar" id="mainAvatar" title="點我有驚喜" src="https://screenshotone.com" onerror="this.src='https://github.io';" alt="小勒的頭像">
        
        <h1>小勒的秘密基地ฅ^•ω•^ฅ</h1>
        <p class="tagline">竟然被你發現了?!(害羞害羞)^//• ω •//^</p>
        
        <div class="links-container">
            <a class="link-btn" href="https://youtube.com" target="_blank">🎬 YouTube 頻道 🎬</a>
            <a class="link-btn" href="https://telegra.ph" target="_blank">📜 自設介紹 📜</a>
        </div>
        
        <footer>© 2026 想要700訂閱的小勒 Project</footer>
    </div>

    <script>
        function getAvatarUrl() {
            return "url('https://screenshotone.com')";
        }

        // 1. 背景圖片自動飄落（手機版數量稍微縮減避免耗電卡頓）
        function createFallingCat() {
            const cat = document.createElement('div');
            cat.classList.add('snowflake');
            cat.style.backgroundImage = getAvatarUrl(); 
            cat.style.left = Math.random() * 100 + 'vw';
            cat.style.animationDuration = Math.random() * 4 + 7 + 's'; 
            cat.style.opacity = Math.random() * 0.2 + 0.4; 
            const size = Math.random() * 20 + 30; // 手機版稍微縮小一點點點
            cat.style.width = size + 'px';
            cat.style.height = size + 'px';
            document.body.appendChild(cat);
            setTimeout(() => { cat.remove(); }, 11000);
        }
        setInterval(createFallingCat, 1100); 

        // 2. 軌跡特效建立函數
        function spawnTrail(x, y) {
            const paw = document.createElement('div');
            paw.classList.add('trail-paws');
            paw.style.backgroundImage = getAvatarUrl(); 
            paw.style.left = x + 'px';
            paw.style.top = y + 'px';
            document.body.appendChild(paw);
            setTimeout(() => { paw.remove(); }, 500);
        }

        // 電腦滑鼠移動軌跡
        let lastMove = 0;
        window.addEventListener('mousemove', (e) => {
            const now = Date.now();
            if (now - lastMove < 50) return; 
            lastMove = now;
            spawnTrail(e.clientX, e.clientY);
        });

        // 手機手指拖曳滑動軌跡
        window.addEventListener('touchmove', (e) => {
            const now = Date.now();
            if (now - lastMove < 50) return;
            lastMove = now;
            if(e.touches.length > 0) {
                spawnTrail(e.touches[0].clientX, e.touches[0].clientY);
            }
        });

        // 3. 點擊大爆發函數
        function triggerBurst(x, y) {
            for (let i = 0; i < 8; i++) { // 手機版爆發 8 張，流暢度最高
                const burst = document.createElement('div');
                burst.classList.add('click-burst');
                burst.style.backgroundImage = getAvatarUrl(); 
                burst.style.left = x + 'px';
                burst.style.top = y + 'px';
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 80 + 40;
                const mx = Math.cos(angle) * distance + 'px';
                const my = Math.sin(angle) * distance + 'px';
                burst.style.setProperty('--mx', mx);
                burst.style.setProperty('--my', my);
                document.body.appendChild(burst);
                setTimeout(() => { burst.remove(); }, 600);
            }
        }

        // 支援電腦點擊與手機輕觸爆炸（排除按鈕與頭像）
        function handleClickOrTouch(e, clientX, clientY) {
            if (e.target.tagName !== 'A' && e.target.id !== 'mainAvatar') {
                triggerBurst(clientX, clientY);
            }
        }

        window.addEventListener('click', (e) => {
            // 如果是觸控事件觸發的 click 就跳過，避免手機重複觸發
            if (e.detail === 0) return; 
            handleClickOrTouch(e, e.clientX, e.clientY);
        });

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                handleClickOrTouch(e, e.touches[0].clientX, e.touches[0].clientY);
            }
        });

        // 4. 自製放鬆 Lo-Fi 音樂
        let audioCtx = null;
        let isPlaying = false;
        let lofiInterval = null;
        let step = 0;

        const chords = [
            [261.63, 329.63, 392.00, 493.88], 
            [220.00, 261.63, 329.63, 392.00], 
            [293.66, 349.23, 440.00, 523.25], 
            [196.00, 246.94, 293.66, 392.00]  
        ];

        function playLoFiBeat() {
            if (!audioCtx || !isPlaying) return;
            const now = audioCtx.currentTime;
            const currentChord = chords[Math.floor(step / 4) % chords.length];

            if (step % 2 === 0) {
                let noiseOsc = audioCtx.createOscillator();
                let noiseGain = audioCtx.createGain();
                noiseOsc.type = 'triangle';
